name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    name: Python ${{ matrix.python }}, Django ${{ matrix.django }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # actions/python-versions has no Python 3.8 builds for Ubuntu 26.04
          - python: "3.8"
            django: "~=4.2.0"
            os: ubuntu-24.04
          - python: "3.12"
            django: "~=5.2.0"
          - python: "3.14"
            django: ">=6.0,<7"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]" "Django${{ matrix.django }}"

      - name: Run the tests
        run: python -m pytest
