[metadata]
name = django-autocompletefilter
version = 0.2.0
description = Django ModelAdmin list_filter with autocomplete widget.
long_description = file: README.rst

author = Julian Wachholz
author_email = julian@wachholz.ch
url = https://github.com/julianwachholz/django-autocompletefilter
license = MIT
license_files = LICENSE
keywords = django django-admin autocomplete auto-complete filter select2
classifiers =
    Development Status :: 4 - Beta
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 4.2
    Framework :: Django :: 5.0
    Framework :: Django :: 5.1
    Framework :: Django :: 5.2
    Framework :: Django :: 6.0
    Framework :: Django :: 6.1
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14

[options]
python_requires = >=3.8
install_requires =
    Django >= 4.2
packages = find:
include_package_data = true

[options.packages.find]
exclude =
    tests
    tests.*

[options.extras_require]
test =
    pytest
    pytest-django

[tool:pytest]
DJANGO_SETTINGS_MODULE = tests.settings
pythonpath = .
testpaths = tests

[flake8]
exclude = .git,__pycache__,.venv,build,dist
max-line-length = 119
# don't force docstrings
ignore = D100,D101,D102,D103,D104,D105,D106,D107
